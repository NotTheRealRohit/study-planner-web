services:
  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-dockerhub.payment-providercorp.com/library/python:3.12-slim}
        UV_IMAGE: ${UV_IMAGE:-dockerhub.payment-providercorp.com/astral/uv:0.11.19}
      secrets:
        - ca_bundle
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"

secrets:
  ca_bundle:
    file: ${DOCKER_CA_BUNDLE:-/usr/local/etc/openssl/certs/combined_cacerts.pem}
